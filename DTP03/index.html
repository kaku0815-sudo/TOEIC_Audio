<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTP 03 | TOEIC Listening Practice</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#f3f4f6;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
main{max-width:580px;margin:auto;padding:30px 18px 65px}.logo{display:block;width:min(245px,72%);margin:8px auto 42px;height:auto}
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(140deg,#fff 12%,#e8ebee 100%);padding:34px 25px 28px;box-shadow:0 8px 26px #0000000b}
.eyebrow{font-size:11px;letter-spacing:3px;color:#929aa3;font-weight:750}h1{font-size:clamp(28px,6.5vw,38px);letter-spacing:-1.3px;line-height:1.12;margin:17px 0 13px;max-width:360px}.zh{color:#6e7782;font-size:14px;margin:0}
.headphones{position:absolute;right:14px;top:18px;font-size:66px;opacity:.13;filter:grayscale(1)}
.test{margin-top:25px;display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #e8eaed;border-radius:21px;padding:17px 19px;box-shadow:0 7px 22px #00000008}
.testicon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e7ebef;color:#5e6976;font-size:23px}.test strong{font-size:23px;letter-spacing:.2px}.test small{display:block;color:#89909a;margin-top:3px;font-size:12px}
.section{display:flex;justify-content:space-between;align-items:center;margin:31px 4px 14px;color:#777f89;font-size:11px;font-weight:800;letter-spacing:1.5px}.section em{font-style:normal;letter-spacing:0;font-weight:500}
.part{background:white;border:1px solid #eaecf0;border-radius:20px;margin:0 0 12px;box-shadow:0 5px 20px #00000007;overflow:hidden}
.part summary{display:flex;align-items:center;gap:16px;cursor:pointer;padding:17px 19px;list-style:none;min-height:78px}summary::-webkit-details-marker{display:none}
.num{width:38px;height:38px;flex:none;border-radius:12px;background:#f0f2f4;display:grid;place-items:center;font-size:13px;color:#929ba4;font-weight:800}
.label{flex:1;display:flex;flex-direction:column;gap:4px}.label b{font-size:17px;letter-spacing:.2px}.label small{font-size:12px;color:#939ba4}.arrow{font-size:24px;color:#9da5ae;line-height:1;transition:transform .2s}details[open] .arrow{transform:rotate(180deg)}
.tracks{border-top:1px solid #f0f1f3;padding:6px 15px 14px}.track{padding:12px 2px;border-bottom:1px solid #f2f3f4}.track:last-child{border-bottom:0}
.trackname{font-size:12px;font-weight:700;color:#525a64;margin-bottom:8px}.player{display:grid;grid-template-columns:36px 83px minmax(0,1fr);gap:8px;align-items:center;border-radius:12px;background:#f5f6f8;padding:8px;min-width:0}
.play{width:36px;height:36px;border-radius:50%;border:0;background:#e1e6eb;display:grid;place-items:center;padding:0;cursor:pointer}
.play i{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #667b91;margin-left:3px}.play.on i{width:12px;height:14px;border:0;margin:0;background:linear-gradient(90deg,#667b91 0 4px,transparent 4px 8px,#667b91 8px)}
.time{font-size:11px;white-space:nowrap;color:#606b77;font-variant-numeric:tabular-nums}.seek{width:100%;min-width:0;accent-color:#8494a5}footer{text-align:center;font-size:11px;color:#a5aab2;margin-top:34px}
@media(max-width:380px){main{padding:19px 12px 50px}.hero{padding:27px 19px}.part summary{padding:14px}.player{grid-template-columns:36px 76px minmax(0,1fr);gap:5px}}

body{background:linear-gradient(160deg,#eaf6ff 0%,#f4fbff 40%,#f6faff 100%);color:#11345f}
main{max-width:600px;padding-top:24px}
.logo{width:min(325px,88%);margin:10px auto 28px}
.hero{background:linear-gradient(125deg,#d9efff,#eef9ff 66%,#c8e8ff);box-shadow:0 12px 28px #3c91cc22;border:1px solid #d0eaff}
.eyebrow{color:#2371b4}.hero h1{color:#074481}.hero .zh{color:#427fa9}
.headphones{opacity:.45;filter:none;font-size:76px;right:17px;top:24px}
.test{background:linear-gradient(110deg,#d4eaff,#e4f6ff);border-color:#b8def9;box-shadow:0 7px 22px #2186ce17}
.testicon{background:#0c79d5;color:white}.test strong{color:#075295}.test small{color:#3979aa}
.section{color:#347bb1}
.part{border-color:#dceeff;box-shadow:0 8px 24px #277ac515}
.part summary{min-height:80px}.label b{color:#0b4f8f}.label small{color:#527b9f}
.num{border-radius:50%;background:#d8edff;color:#0875ce;font-size:18px}
.part:nth-of-type(4) .num{background:#d9f8ed;color:#079a7e}
.part:nth-of-type(5) .num{background:#ffecd8;color:#d37b1a}
.part:nth-of-type(6) .num{background:#fbe0ec;color:#c74b81}
.arrow{color:#187cc4}.player{background:#f0f8ff}.play{background:#dcefff}
.play i{border-left-color:#0878d8}.play.on i{background:linear-gradient(90deg,#0878d8 0 4px,transparent 4px 8px,#0878d8 8px)}
.seek{accent-color:#1387dc}

/* 方案 A · 淡彩柔和配色：只變更外觀，不修改播放器 JavaScript */
body{background:linear-gradient(155deg,#fff5fa 0%,#f2f8ff 42%,#f4fff9 100%)}
.hero{background:linear-gradient(120deg,#fceeff 0%,#eaf5ff 58%,#e9fff4 100%);border-color:#e9e5f6;box-shadow:0 12px 28px #9886c217}
.eyebrow{color:#8773a7}.hero h1{color:#334b77}.hero .zh{color:#71829a}
.test{background:linear-gradient(110deg,#f0eaff,#e9f7ff);border-color:#e5dff6}
.testicon{background:#a9b8ee;color:#fff}.test strong{color:#52658f}.test small{color:#7b85a3}
.section{color:#8490a5}
.part{border-color:#edf0f4;box-shadow:0 8px 23px #8f99b018}
.part:nth-of-type(3){background:#eff7ff;border-color:#dcecff}
.part:nth-of-type(4){background:#ecfcf6;border-color:#d8f2e7}
.part:nth-of-type(5){background:#fff5e9;border-color:#faead8}
.part:nth-of-type(6){background:#fff0f6;border-color:#f6e0e9}
.part:nth-of-type(3) .num{background:#d7eaff;color:#477fc1}
.part:nth-of-type(4) .num{background:#d1f3e4;color:#3d9b7a}
.part:nth-of-type(5) .num{background:#ffe4c5;color:#c18b48}
.part:nth-of-type(6) .num{background:#fbd9e8;color:#bb668a}
.label b{color:#3f5676}.label small{color:#7d8a9c}.arrow{color:#8b9db3}
.tracks{border-top-color:#ffffffad}.player{background:#ffffffb8}.play{background:#dceafa}.play i{border-left-color:#608ac1}
.play.on i{background:linear-gradient(90deg,#608ac1 0 4px,transparent 4px 8px,#608ac1 8px)}
.seek{accent-color:#8eadd6}

/* PART 1–4：明確指定各自淡彩背景，不依賴 nth-of-type 順序 */
.part.part-1{background:#eaf5ff!important;border-color:#c9e5fc!important}
.part.part-2{background:#e9faf2!important;border-color:#c8ecd9!important}
.part.part-3{background:#fff2e5!important;border-color:#f7ddc1!important}
.part.part-4{background:#fff0f6!important;border-color:#f3d2e2!important}
.part.part-1 .num{background:#cfe8ff!important;color:#2477bd!important}
.part.part-2 .num{background:#c8f1de!important;color:#238c68!important}
.part.part-3 .num{background:#ffe0bf!important;color:#b97228!important}
.part.part-4 .num{background:#f9d2e4!important;color:#b54e80!important}

/* Pastel headphone cards — all four PARTs share the same icon geometry */
.part.part-1{background:linear-gradient(110deg,#e1f3ff,#d5ecff)!important;border:2px solid #fff!important;--tone:#0969c8;--circle:#b3dfff;--glow:#7ec3ff}
.part.part-2{background:linear-gradient(110deg,#e3fbe8,#d2f8df)!important;border:2px solid #fff!important;--tone:#087956;--circle:#b3f1cc;--glow:#80dcaa}
.part.part-3{background:linear-gradient(110deg,#fff0df,#ffe0c2)!important;border:2px solid #fff!important;--tone:#b34d0a;--circle:#ffd09b;--glow:#ffb76c}
.part.part-4{background:linear-gradient(110deg,#ffebf3,#ffd5e8)!important;border:2px solid #fff!important;--tone:#b71261;--circle:#ffc0dc;--glow:#ff8dbb}
.part{box-shadow:0 9px 24px #274e7d14!important;border-radius:23px!important}
.part summary{min-height:98px!important;padding:15px 17px!important;gap:15px!important}
.part .num{width:69px!important;height:69px!important;flex:0 0 69px!important;border-radius:50%!important;background:radial-gradient(circle at 32% 22%,#ffffffaa,var(--circle))!important;box-shadow:inset 0 2px 8px #ffffff88,0 4px 12px #33445513;display:grid;place-items:center;color:var(--tone)!important}
.headphone-icon{width:51px;height:51px;overflow:visible;filter:drop-shadow(0 3px 2px #263f5a22)}
.headphone-icon .headband{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round}
.headphone-icon .earpad{fill:currentColor;stroke:#fff;stroke-width:2.5}
.headphone-icon .shine{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:.8}
.headphone-icon .wave{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;opacity:.9}
.part .label b{font-size:21px!important;color:var(--tone)!important}
.part .label small{font-size:13px!important;color:#536477!important}
.part .arrow{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:#ffffffb8;display:grid;place-items:center;font-size:0!important;color:var(--tone)!important}
.part .arrow::before{content:"";width:10px;height:10px;border-top:3px solid currentColor;border-right:3px solid currentColor;transform:rotate(45deg);margin-left:-4px}
.part[open] .arrow{transform:none!important}
.part[open] .arrow::before{transform:rotate(135deg);margin-left:0;margin-top:-5px}
.part .tracks{background:#ffffff9c;border-top:1px solid #ffffffbd}
@media(max-width:380px){.part summary{padding:12px!important;gap:10px!important}.part .num{width:59px!important;height:59px!important;flex-basis:59px!important}.headphone-icon{width:45px;height:45px}.part .label b{font-size:18px!important}.part .label small{font-size:11px!important}}

/* 依照手機註記：將 DTP 03 移入主標題，取消下方獨立測驗卡片 */
.hero .hero-dtp{
  display:table;
  position:relative;
  z-index:2;
  margin:15px 0 13px;
  padding:7px 21px;
  border-radius:999px;
  background:linear-gradient(100deg,#cce9ff,#dbe8ff);
  color:#075aa7;
  font-size:clamp(19px,5vw,26px);
  line-height:1.25;
  font-weight:800;
  letter-spacing:.045em;
  box-shadow:0 4px 13px rgba(51,125,197,.08);
}
.hero .zh{position:relative;z-index:2}
.hero{padding-bottom:28px}
.section{margin-top:25px}
@media(max-width:390px){
  .hero .hero-dtp{font-size:21px;padding:6px 17px}
}

/* DTP 03 位於 TOEIC 右側，間距約半個字寬 */
.hero .toeic-line{display:inline-flex;align-items:baseline;gap:.5em;white-space:nowrap}
.hero .dtp-inline{font-size:1em;font-weight:800;letter-spacing:0;color:#075aa7;vertical-align:baseline}
.hero .hero-dtp{display:none}
@media(max-width:390px){.hero .toeic-line{gap:.5em}.hero .dtp-inline{font-size:1em}}

/* PART 1–4：白色圓形與 > 箭頭真正水平、垂直置中 */
.part .arrow{display:flex!important;align-items:center!important;justify-content:center!important;position:relative!important;width:42px!important;height:42px!important;flex:0 0 42px!important;margin:0!important;padding:0!important;line-height:0!important;border-radius:50%!important;background:rgba(255,255,255,.86)!important}
.part .arrow::before{content:""!important;display:block!important;position:absolute!important;left:50%!important;top:50%!important;width:11px!important;height:11px!important;margin:0!important;border-top:3px solid currentColor!important;border-right:3px solid currentColor!important;transform:translate(-65%,-50%) rotate(45deg)!important;box-sizing:border-box!important}
.part[open] .arrow::before{transform:translate(-50%,-65%) rotate(135deg)!important;margin:0!important}

/* 壓縮公司 LOGO 所在的頂部區塊至約原高度三分之一 */
main{padding-top:8px!important}
.logo{display:block!important;width:min(325px,88%)!important;max-height:45px!important;object-fit:contain!important;margin:2px auto 9px!important}
@media(max-width:380px){main{padding-top:6px!important}.logo{max-height:40px!important;margin:2px auto 7px!important}}

/* LOGO 近滿版寬度，維持等比例且不裁切 */
.logo{width:96%!important;max-width:none!important;max-height:none!important;height:auto!important;object-fit:contain!important;margin:2px auto 10px!important}
@media(max-width:380px){.logo{width:96%!important;max-height:none!important;height:auto!important}}
</style></head><body><main>
<img class="logo" src="../大新科技出版有限公司標誌.png" alt="大新科技出版有限公司">
<section class="hero"><span class="headphones">🎧</span><div class="eyebrow">LISTEN · LEARN · PRACTICE</div><h1><span class="toeic-line">TOEIC <span class="dtp-inline">DTP 03</span></span><br>Listening Practice</h1><p class="zh">英語聽力練習平台</p></section>
<div class="section"><span>LISTENING SECTIONS</span><em>4 PARTS</em></div><details class="part part-1"><summary><span class="num"><svg class="headphone-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path class="headband" d="M11 35v-7C11 15 20 7 32 7s21 8 21 21v7"/><rect class="earpad" x="7" y="30" width="13" height="24" rx="6"/><rect class="earpad" x="44" y="30" width="13" height="24" rx="6"/><path class="shine" d="M14 27c1-10 8-16 18-16"/><path class="wave" d="M27 29v17m5-23v26m5-20v17"/></svg></span><span class="label"><b>PART 1</b><small>Photographs</small></span><span class="arrow">⌄</span></summary><div class="tracks" data-start="1" data-end="6" data-part="1"></div></details>
<details class="part part-2"><summary><span class="num"><svg class="headphone-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path class="headband" d="M11 35v-7C11 15 20 7 32 7s21 8 21 21v7"/><rect class="earpad" x="7" y="30" width="13" height="24" rx="6"/><rect class="earpad" x="44" y="30" width="13" height="24" rx="6"/><path class="shine" d="M14 27c1-10 8-16 18-16"/><path class="wave" d="M27 29v17m5-23v26m5-20v17"/></svg></span><span class="label"><b>PART 2</b><small>Question–Response</small></span><span class="arrow">⌄</span></summary><div class="tracks" data-start="7" data-end="31" data-part="2"></div></details>
<details class="part part-3"><summary><span class="num"><svg class="headphone-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path class="headband" d="M11 35v-7C11 15 20 7 32 7s21 8 21 21v7"/><rect class="earpad" x="7" y="30" width="13" height="24" rx="6"/><rect class="earpad" x="44" y="30" width="13" height="24" rx="6"/><path class="shine" d="M14 27c1-10 8-16 18-16"/><path class="wave" d="M27 29v17m5-23v26m5-20v17"/></svg></span><span class="label"><b>PART 3</b><small>Conversations</small></span><span class="arrow">⌄</span></summary><div class="tracks" data-start="32" data-end="49" data-part="3"></div></details>
<details class="part part-4"><summary><span class="num"><svg class="headphone-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path class="headband" d="M11 35v-7C11 15 20 7 32 7s21 8 21 21v7"/><rect class="earpad" x="7" y="30" width="13" height="24" rx="6"/><rect class="earpad" x="44" y="30" width="13" height="24" rx="6"/><path class="shine" d="M14 27c1-10 8-16 18-16"/><path class="wave" d="M27 29v17m5-23v26m5-20v17"/></svg></span><span class="label"><b>PART 4</b><small>Talks</small></span><span class="arrow">⌄</span></summary><div class="tracks" data-start="41" data-end="54" data-part="4"></div></details>
<footer>DAH HSIN TECHNOLOGY PUBLISHING</footer></main>
<script>
(()=>{
let active=null;
const fmt=t=>Number.isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
function reset(a){a.pause();try{a.currentTime=0}catch(e){}const row=a.closest('.player');row.querySelector('.play').classList.remove('on');row.querySelector('.seek').value=0;row.querySelector('.time').textContent='0:00 / '+fmt(a.duration)}
function bind(row){
const a=row.querySelector('audio'),btn=row.querySelector('.play'),time=row.querySelector('.time'),seek=row.querySelector('.seek');
btn.onclick=async()=>{if(!a.paused){a.pause();return}if(active&&active!==a)reset(active);active=a;if(!a.src){a.src=a.dataset.src;a.load()}try{await a.play()}catch(err){console.error(err);btn.classList.remove('on')}};
a.onplay=()=>btn.classList.add('on');a.onpause=()=>btn.classList.remove('on');
a.onloadedmetadata=()=>time.textContent='0:00 / '+fmt(a.duration);
a.ontimeupdate=()=>{if(a.duration){seek.value=100*a.currentTime/a.duration;time.textContent=fmt(a.currentTime)+' / '+fmt(a.duration)}};
a.onended=()=>{reset(a);if(active===a)active=null};
seek.oninput=()=>{if(a.duration)a.currentTime=a.duration*seek.value/100};
}
function build(container){
if(container.dataset.done)return;container.dataset.done='1';
let part=container.dataset.part;
let names=[['PART '+part,'PART_'+part+'.mp3']];
for(let i=+container.dataset.start;i<=+container.dataset.end;i++){let id='DTP03_L'+String(i).padStart(3,'0');names.push([id,id+'.mp3'])}
for(const [label,file] of names){const row=document.createElement('div');row.className='track';row.innerHTML='<div class="trackname"></div><div class="player"><button class="play" type="button" aria-label="播放"><i></i></button><span class="time">0:00 / 0:00</span><input class="seek" type="range" min="0" max="100" value="0" step=".1" aria-label="播放進度"><audio preload="none"></audio></div>';row.querySelector('.trackname').textContent=label;row.querySelector('audio').dataset.src=(file.startsWith('DTP03_') ? '../TOEIC_mp3/' : '../TOEIC_mp3/mp3/')+file;container.appendChild(row);bind(row.querySelector('.player'))}
}
document.querySelectorAll('.part').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){document.querySelectorAll('.part').forEach(x=>{if(x!==d)x.open=false});build(d.querySelector('.tracks'))}else if(active&&d.contains(active)){reset(active);active=null}}));
})();
</script></body></html>

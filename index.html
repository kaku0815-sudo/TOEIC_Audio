<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TOEIC Listening Practice</title>

    <style>

        /* =========================
           基本設定
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f3f5f7;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }


        /* =========================
           頁首
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .publisher-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 320px;
            max-width: 75%;
            height: auto;
        }

        .header h1 {
            font-size: 26px;
            margin: 5px 0;
        }

        .header p {
            margin-top: 8px;
            color: #666;
        }


        /* =========================
           PART 區塊
        ========================= */

        .unit {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        summary {
            list-style: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 0;
            user-select: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }


        /* 尚未展開：三角形朝下 */

        summary::before {
            content: "▼";
            margin-right: 8px;
            font-size: 14px;
        }


        /* 展開：三角形朝上 */

        details[open] summary::before {
            content: "▲";
        }

        details[open] summary {
            margin-bottom: 15px;
        }


        /* =========================
           每一首音檔
        ========================= */

        .track {
            margin-top: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eeeeee;
        }

        .track:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .track-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }


        /* =========================
           自訂播放器
        ========================= */

        .custom-player {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }


        /* 播放 / 暫停 */

        .play-btn {
            border: none;
            background: transparent;
            font-size: 21px;
            cursor: pointer;
            padding: 4px 6px;
            flex-shrink: 0;
        }

        .play-btn:hover {
            opacity: 0.7;
        }


        /* 播放時間 */

        .time-text {
            font-size: 13px;
            white-space: nowrap;
            min-width: 78px;
        }


        /* =========================
           播放進度
        ========================= */

        .seek-bar {
            flex: 1;
            min-width: 100px;
            cursor: pointer;
            accent-color: #000000;
        }


        /* =========================
           音量
        ========================= */

        .volume-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .volume-bar {
            width: 80px;
            cursor: pointer;
            accent-color: #000000;
        }


        /* =========================
           手機版
        ========================= */

        @media (max-width: 480px) {

            .container {
                padding: 12px;
            }

            .logo {
                width: 280px;
                max-width: 85%;
            }

            .header h1 {
                font-size: 22px;
            }

            .header p {
                font-size: 14px;
            }

            .unit {
                padding: 16px;
                border-radius: 14px;
            }

            summary {
                font-size: 19px;
            }

            .track-title {
                font-size: 15px;
            }

            .custom-player {
                display: grid;

                grid-template-columns:
                    auto auto 1fr;

                align-items: center;
                gap: 8px;
            }

            .play-btn {
                grid-column: 1;
            }

            .time-text {
                grid-column: 2;
            }

            .seek-bar {
                grid-column: 3;
                width: 100%;
                min-width: 0;
            }

            .volume-icon {
                grid-column: 2;
                text-align: right;
            }

            .volume-bar {
                grid-column: 3;
                width: 100%;
            }
        }

    </style>
</head>

<script>

/* ==================================================
   1. 自動建立所有播放器
================================================== */

document
    .querySelectorAll(".tracks")
    .forEach(function (container) {

        const start =
            Number(container.dataset.start);

        const end =
            Number(container.dataset.end);


        for (let i = start; i <= end; i++) {

            const number =
                String(i).padStart(3, "0");

            const filename =
                "DTP01_L" + number;


            const track =
                document.createElement("div");

            track.className =
                "track";


            track.innerHTML = `

                <div class="track-title">
                    ${filename}
                </div>

                <div class="custom-player">

                    <audio
                        class="track-audio"
                        preload="metadata"
                    >

                        <source
                            src="TOEIC_mp3/mp3/${filename}.mp3"
                            type="audio/mpeg"
                        >

                    </audio>


                    <button
                        class="play-btn"
                        type="button"
                        aria-label="播放"
                    >
                        ▶
                    </button>


                    <span class="time-text">
                        0:00 / 0:00
                    </span>


                    <input
                        class="seek-bar"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                        aria-label="播放進度"
                    >


                    <span
                        class="volume-icon"
                        title="音量"
                    >
                        🔊
                    </span>


                    <input
                        class="volume-bar"
                        type="range"
                        min="0"
                        max="1"
                        value="1"
                        step="0.05"
                        aria-label="音量"
                    >

                </div>
            `;


            container.appendChild(track);
        }

    });



/* ==================================================
   2. 時間格式
================================================== */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);


    return (
        minutes +
        ":" +
        secs.toString().padStart(2, "0")
    );
}



/* ==================================================
   3. 設定所有播放器
================================================== */

document
    .querySelectorAll(".custom-player")
    .forEach(function (player) {


        const audio =
            player.querySelector(".track-audio");

        const playBtn =
            player.querySelector(".play-btn");

        const timeText =
            player.querySelector(".time-text");

        const seekBar =
            player.querySelector(".seek-bar");

        const volumeBar =
            player.querySelector(".volume-bar");

        const volumeIcon =
            player.querySelector(".volume-icon");



        /* =========================
           MP3 載入完成
        ========================= */

        audio.addEventListener(
            "loadedmetadata",
            function () {

                timeText.textContent =
                    "0:00 / " +
                    formatTime(audio.duration);

            }
        );



        /* =========================
           播放 / 暫停
        ========================= */

        playBtn.addEventListener(
            "click",
            function () {

                if (audio.paused) {

                    audio.play();

                } else {

                    audio.pause();

                }

            }
        );



        /* =========================
           開始播放
        ========================= */

        audio.addEventListener(
            "play",
            function () {


                /* 其他音檔全部暫停 */

                document
                    .querySelectorAll(".track-audio")
                    .forEach(function (otherAudio) {

                        if (otherAudio !== audio) {

                            otherAudio.pause();

                        }

                    });


                playBtn.textContent =
                    "⏸";

            }
        );

        /* ==================================================
        只能同時播放一首
        ================================================== */
        document.addEventListener("play", function(event) {

            if (event.target.tagName === "AUDIO") {

                const currentAudio = event.target;
                const allAudios = document.querySelectorAll("audio");

        allAudios.forEach(function(audio) {

            if (audio !== currentAudio) {

                // 停止前一首
                audio.pause();

                // 回到最開始
                audio.currentTime = 0;

                // 更新播放器畫面
                const player = audio.closest(".custom-player");

                if (player) {
                    const playBtn = player.querySelector(".play-btn");
                    const seekBar = player.querySelector(".seek-bar");
                    const timeText = player.querySelector(".time-text");

                    if (playBtn) {
                        playBtn.textContent = "▶";
                    }

                    if (seekBar) {
                        seekBar.value = 0;
                    }

                    if (timeText) {
                        const duration = audio.duration;

                        if (isFinite(duration)) {
                            const minutes = Math.floor(duration / 60);
                            const seconds = Math.floor(duration % 60);

                            timeText.textContent =
                                "0:00 / " +
                                minutes + ":" +
                                seconds.toString().padStart(2, "0");
                        }
                    }
                }
            }
        });
    }

}, true);



        /* =========================
           暫停
        ========================= */

        audio.addEventListener(
            "pause",
            function () {

                playBtn.textContent =
                    "▶";

            }
        );



        /* =========================
           播放結束
        ========================= */

        audio.addEventListener(
            "ended",
            function () {

                playBtn.textContent =
                    "▶";

                seekBar.value =
                    0;

                audio.currentTime =
                    0;

                timeText.textContent =
                    "0:00 / " +
                    formatTime(audio.duration);

            }
        );



        /* =========================
           更新時間與黑球位置
        ========================= */

        audio.addEventListener(
            "timeupdate",
            function () {

                if (!audio.duration) {
                    return;
                }


                const percent =

                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;


                seekBar.value =
                    percent;


                timeText.textContent =

                    formatTime(audio.currentTime)

                    +

                    " / "

                    +

                    formatTime(audio.duration);

            }
        );



        /* =========================
           拖曳黑球
        ========================= */

        seekBar.addEventListener(
            "input",
            function () {

                if (!audio.duration) {
                    return;
                }


                audio.currentTime =

                    (
                        Number(seekBar.value) /
                        100
                    )

                    *

                    audio.duration;

            }
        );



        /* =========================
           音量控制
        ========================= */

        volumeBar.addEventListener(
            "input",
            function () {

                audio.volume =
                    Number(volumeBar.value);


                if (audio.volume === 0) {

                    volumeIcon.textContent =
                        "🔇";

                }

                else if (audio.volume < 0.5) {

                    volumeIcon.textContent =
                        "🔉";

                }

                else {

                    volumeIcon.textContent =
                        "🔊";

                }

            }
        );

    });



/* ==================================================
   4. PART 收起時停止該 PART 音檔
================================================== */

document
    .querySelectorAll("details.unit")
    .forEach(function (unit) {

        unit.addEventListener(
            "toggle",
            function () {

                if (!unit.open) {

                    unit
                        .querySelectorAll("audio")
                        .forEach(function (audio) {

                            audio.pause();

                        });

                }

            }
        );

    });

/* ==================================================
   5. 保證同時間只展開一個 PART
================================================== */

const units =
    document.querySelectorAll("details.unit");


units.forEach(function (unit) {

    unit.addEventListener(
        "toggle",
        function () {

            if (unit.open) {

                units.forEach(
                    function (otherUnit) {

                        if (otherUnit !== unit) {

                            otherUnit.removeAttribute("open");

                        }

                    }
                );

            }

        }
    );

});



</script>

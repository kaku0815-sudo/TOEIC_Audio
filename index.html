<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TOEIC Listening Practice</title>

    <style>

        /* =========================
           基本設定
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f3f5f7;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }


        /* =========================
           頁首
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .publisher-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 320px;
            max-width: 75%;
            height: auto;
        }

        .header h1 {
            font-size: 26px;
            margin: 5px 0;
        }

        .header p {
            margin-top: 8px;
            color: #666;
        }


        /* =========================
           PART 區塊
        ========================= */

        .unit {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        summary {
            list-style: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 0;
            user-select: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }


        /* 尚未展開：三角形朝下 */

        summary::before {
            content: "▼";
            margin-right: 8px;
            font-size: 14px;
        }


        /* 展開：三角形朝上 */

        details[open] summary::before {
            content: "▲";
        }

        details[open] summary {
            margin-bottom: 15px;
        }


        /* =========================
           每一首音檔
        ========================= */

        .track {
            margin-top: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eeeeee;
        }

        .track:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .track-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }


        /* =========================
           自訂播放器
        ========================= */

        .custom-player {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }


        /* 播放 / 暫停 */

        .play-btn {
            border: none;
            background: transparent;
            font-size: 21px;
            cursor: pointer;
            padding: 4px 6px;
            flex-shrink: 0;
        }

        .play-btn:hover {
            opacity: 0.7;
        }


        /* 播放時間 */

        .time-text {
            font-size: 13px;
            white-space: nowrap;
            min-width: 78px;
        }


        /* =========================
           播放進度
        ========================= */

        .seek-bar {
            flex: 1;
            min-width: 100px;
            cursor: pointer;
            accent-color: #000000;
        }


        /* =========================
           音量
        ========================= */

        .volume-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .volume-bar {
            width: 80px;
            cursor: pointer;
            accent-color: #000000;
        }


        /* =========================
           手機版
        ========================= */

        @media (max-width: 480px) {

            .container {
                padding: 12px;
            }

            .logo {
                width: 280px;
                max-width: 85%;
            }

            .header h1 {
                font-size: 22px;
            }

            .header p {
                font-size: 14px;
            }

            .unit {
                padding: 16px;
                border-radius: 14px;
            }

            summary {
                font-size: 19px;
            }

            .track-title {
                font-size: 15px;
            }

            .custom-player {
                display: grid;

                grid-template-columns:
                    auto auto 1fr;

                align-items: center;
                gap: 8px;
            }

            .play-btn {
                grid-column: 1;
            }

            .time-text {
                grid-column: 2;
            }

            .seek-bar {
                grid-column: 3;
                width: 100%;
                min-width: 0;
            }

            .volume-icon {
                grid-column: 2;
                text-align: right;
            }

            .volume-bar {
                grid-column: 3;
                width: 100%;
            }
        }

    </style>
</head>

<script>
/* ==================================================
   超輕量手機版
   1. 展開 PART 才建立該 PART 的曲目畫面
   2. 按播放才真正把 MP3 網址交給 <audio>
   3. 同時間只保留一首正在播放
================================================== */

function formatTime(seconds) {
    if (!isFinite(seconds)) return "0:00";
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return minutes + ":" + secs.toString().padStart(2, "0");
}

let currentAudio = null;

/* 真正需要播放時，才載入 MP3 */
function ensureAudioSource(audio) {
    if (audio.dataset.loaded === "1") return;

    let source = audio.querySelector("source");
    if (source && source.dataset.src) {
        source.src = source.dataset.src;
    } else if (audio.dataset.src) {
        source = document.createElement("source");
        source.src = audio.dataset.src;
        source.type = "audio/mpeg";
        audio.appendChild(source);
    }

    audio.dataset.loaded = "1";
    audio.load();
}

function resetPlayer(audio) {
    audio.pause();
    try { audio.currentTime = 0; } catch (e) {}

    const player = audio.closest(".custom-player");
    if (!player) return;

    const btn = player.querySelector(".play-btn");
    const seek = player.querySelector(".seek-bar");
    const time = player.querySelector(".time-text");

    if (btn) btn.textContent = "▶";
    if (seek) seek.value = 0;
    if (time) {
        time.textContent = "0:00 / " +
            (isFinite(audio.duration) ? formatTime(audio.duration) : "0:00");
    }
}

function stopOtherAudio(audio) {
    if (currentAudio && currentAudio !== audio) {
        resetPlayer(currentAudio);
    }
    currentAudio = audio;
}

/* 每一個播放器只在它真的出現在畫面後才綁定事件 */
function setupPlayer(player) {
    if (player.dataset.ready === "1") return;
    player.dataset.ready = "1";

    const audio = player.querySelector(".track-audio");
    const playBtn = player.querySelector(".play-btn");
    const timeText = player.querySelector(".time-text");
    const seekBar = player.querySelector(".seek-bar");
    const volumeBar = player.querySelector(".volume-bar");
    const volumeIcon = player.querySelector(".volume-icon");

    playBtn.addEventListener("click", async function () {
        if (!audio.paused) {
            audio.pause();
            return;
        }

        stopOtherAudio(audio);
        ensureAudioSource(audio);

        try {
            await audio.play();
        } catch (err) {
            console.error("音檔播放失敗：", err);
            playBtn.textContent = "▶";
        }
    });

    audio.addEventListener("loadedmetadata", function () {
        timeText.textContent = "0:00 / " + formatTime(audio.duration);
    });

    audio.addEventListener("play", function () {
        playBtn.textContent = "⏸";
    });

    audio.addEventListener("pause", function () {
        playBtn.textContent = "▶";
    });

    audio.addEventListener("ended", function () {
        resetPlayer(audio);
        if (currentAudio === audio) currentAudio = null;
    });

    audio.addEventListener("timeupdate", function () {
        if (!audio.duration) return;
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        timeText.textContent =
            formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
    });

    seekBar.addEventListener("input", function () {
        if (!audio.duration) return;
        audio.currentTime =
            (Number(seekBar.value) / 100) * audio.duration;
    });

    volumeBar.addEventListener("input", function () {
        audio.volume = Number(volumeBar.value);
        if (audio.volume === 0) volumeIcon.textContent = "🔇";
        else if (audio.volume < 0.5) volumeIcon.textContent = "🔉";
        else volumeIcon.textContent = "🔊";
    });
}

/* 展開 PART 時才建立 DTP01 曲目 */
function buildTracks(container) {
    if (container.dataset.built === "1") return;
    container.dataset.built = "1";

    const start = Number(container.dataset.start);
    const end = Number(container.dataset.end);

    const fragment = document.createDocumentFragment();

    for (let i = start; i <= end; i++) {
        const number = String(i).padStart(3, "0");
        const filename = "DTP01_L" + number;

        const track = document.createElement("div");
        track.className = "track";
        track.innerHTML = `
            <div class="track-title">${filename}</div>
            <div class="custom-player">
                <audio
                    class="track-audio"
                    preload="none"
                    data-src="TOEIC_mp3/mp3/${filename}.mp3"
                ></audio>

                <button class="play-btn" type="button" aria-label="播放">▶</button>
                <span class="time-text">0:00 / 0:00</span>

                <input
                    class="seek-bar"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="播放進度"
                >

                <span class="volume-icon" title="音量">🔊</span>

                <input
                    class="volume-bar"
                    type="range"
                    min="0"
                    max="1"
                    value="1"
                    step="0.05"
                    aria-label="音量"
                >
            </div>
        `;
        fragment.appendChild(track);
    }

    container.appendChild(fragment);

    container
        .querySelectorAll(".custom-player")
        .forEach(setupPlayer);
}

/* PART 開頭的播放器很少，可以先綁事件，但仍不載入 MP3 */
document
    .querySelectorAll(".unit > .track .custom-player")
    .forEach(setupPlayer);

/* 展開時才建播放器；同時只展開一個 PART */
const units = document.querySelectorAll("details.unit");

units.forEach(function (unit) {
    unit.addEventListener("toggle", function () {
        if (unit.open) {
            units.forEach(function (other) {
                if (other !== unit) other.removeAttribute("open");
            });

            const tracks = unit.querySelector(".tracks");
            if (tracks) buildTracks(tracks);
        } else {
            unit.querySelectorAll("audio").forEach(function (audio) {
                if (!audio.paused) resetPlayer(audio);
                if (currentAudio === audio) currentAudio = null;
            });
        }
    });
});
</script>
